# Remotely Server (fork MichaelRodriguesOficial) - Docker Compose
#
# Uso:
#   cp .env.example .env      # ajuste os valores
#   docker compose up -d
#
# Acesse http://SEU_IP:5000 (ou o domínio configurado no proxy reverso).
# A primeira conta registrada vira administrador do servidor.

networks:
  remotely:
    name: remotely-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  remotely-data:
    name: remotely-data

services:
  remotely:
    image: ${REMOTELY_IMAGE:-michechel10/remotely}:${REMOTELY_TAG:-1.1.0}
    container_name: remotely
    restart: unless-stopped
    ports:
      # Em produção, prefira "127.0.0.1:5000:5000" e publique via proxy reverso com HTTPS.
      - "${REMOTELY_BIND:-0.0.0.0}:${REMOTELY_PORT:-5000}:5000"
    networks:
      - remotely
    volumes:
      # Banco SQLite, logs, gravações e chaves de criptografia.
      # Para usar uma pasta do host em vez do volume nomeado, troque por
      # "/var/www/remotely:/app/AppData" e rode: sudo chown -R 1654:1654 /var/www/remotely
      - remotely-data:/app/AppData
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5000
      - TZ=${TZ:-America/Sao_Paulo}

      - Serilog__MinimumLevel__Override__Microsoft.AspNetCore=Warning
      - Serilog__MinimumLevel__Override__System=Warning

      # Banco de dados: SQLite (padrão), SQLServer ou PostgreSQL.
      - Remotely_ApplicationOptions__DbProvider=${REMOTELY_DB_PROVIDER:-SQLite}
      - Remotely_ConnectionStrings__SQLite=Data Source=/app/AppData/Remotely.db
      - Remotely_ConnectionStrings__SQLServer=${REMOTELY_SQLSERVER_CONNECTION:-}
      - Remotely_ConnectionStrings__PostgreSQL=${REMOTELY_POSTGRES_CONNECTION:-}

      # Gateway desta rede Docker: liberado para enviar cabeçalhos X-Forwarded-*.
      - Remotely_ApplicationOptions__DockerGatewayIp=172.28.0.1

      # Opções de segurança deste fork.
      - Remotely_ApplicationOptions__EnableSwagger=${REMOTELY_ENABLE_SWAGGER:-true}
      - Remotely_ApplicationOptions__AllowedFrameAncestors=${REMOTELY_ALLOWED_FRAME_ANCESTORS:-}
      - Remotely_ApplicationOptions__AuthRateLimitPerMinute=${REMOTELY_AUTH_RATE_LIMIT:-20}
