name: Release

# - Pull requests: compila os agents (.NET 10, no Windows), a imagem Docker com esses
#   agents e faz um teste de fumaça (sem publicar).
# - Push no master com uma versão nova no arquivo VERSION (ex.: 1.0.1): cria a tag
#   vX.Y.Z e o release com as notas do CHANGELOG.md, publica a imagem no Docker Hub
#   (se os secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN existirem) e no GHCR, e anexa
#   ao release o pacote do servidor e, separado, o pacote dos agents.
# - Release publicado manualmente ou execução manual: publica imagem e pacote.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex.: v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: michechel10/remotely
  GHCR_IMAGE: ghcr.io/michaelrodriguesoficial/remotely

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      create_release: ${{ steps.v.outputs.create_release }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CREATE=false; REF="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"; PUBLISH=true; REF="$TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; PUBLISH=true; REF="$TAG"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
            if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "Release $TAG já existe; nada a publicar."
              PUBLISH=false
            else
              PUBLISH=true; CREATE=true
            fi
          else
            TAG="v0.0.0-pr${{ github.event.number }}"; PUBLISH=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  create-release:
    needs: version
    if: needs.version.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_TEMPLATE.md > notes.md
          # Seção desta versão no CHANGELOG.md (até o próximo "## v")
          awk -v v="## $TAG" 'index($0, v)==1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md >> notes.md
          gh release create "$TAG" --target "${{ github.sha }}" \
            --title "Remotely $TAG" --notes-file notes.md --latest \
            --repo "${{ github.repository }}"
          echo "::notice title=Release::Release $TAG criado"

  agents:
    needs: version
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-agents-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-agents-${{ runner.os }}-

      - name: Compilar agents e clientes de desktop
        shell: pwsh
        run: |
          ./Utilities/Build-Agents.ps1 -OutDir "$env:GITHUB_WORKSPACE/agents-content" 2>&1 | Tee-Object -FilePath agents.log
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            Select-String -Path agents.log -Pattern ": error |falhou" |
              Select-Object -ExpandProperty Line -Unique -First 40 |
              ForEach-Object { Write-Output "::error title=Agents::$_" }
            exit 1
          }
          foreach ($f in @("Remotely-Win-x64.zip", "Remotely-Win-x86.zip", "Remotely-Linux.zip",
                           "Remotely-MacOS-x64.zip", "Remotely-MacOS-arm64.zip",
                           "Win-x64/Remotely_Desktop.exe", "Win-x86/Remotely_Desktop.exe",
                           "Linux-x64/Remotely_Desktop", "AgentVersion.txt")) {
            if (-not (Test-Path "agents-content/$f")) {
              Write-Output "::error title=Agents::Arquivo ausente: $f"
              exit 1
            }
          }
          $files = Get-ChildItem agents-content -Recurse -File | Where-Object Length -gt 1MB | Sort-Object Length -Descending
          $total = ($files | Measure-Object Length -Sum).Sum / 1MB
          $detail = ($files | ForEach-Object { "{0} {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }) -join " | "
          Write-Output ("::notice title=Agents::Versão {0}, {1:N0} MB no total: {2}" -f (Get-Content agents-content/AgentVersion.txt), $total, $detail)

      - uses: actions/upload-artifact@v4
        with:
          name: agents-content
          path: agents-content/
          compression-level: 0
          retention-days: 7

  docker:
    needs: [ version, create-release, agents ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Agents compilados neste build
        uses: actions/download-artifact@v4
        with:
          name: agents-content
          path: docker/agents

      - uses: docker/setup-buildx-action@v3

      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          load: true
          tags: remotely:test
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          docker volume create remotely-test
          docker run -d --name remotely-test -p 5000:5000 -v remotely-test:/app/AppData remotely:test
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://localhost:5000/Account/Login || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          docker logs remotely-test 2>&1 | tail -n 60
          if [ "$code" != "200" ]; then
            echo "::error title=Smoke test::Servidor não respondeu 200 em /Account/Login (último código: $code)"
            # Últimas linhas do container como anotação (visível no PR)
            LOGS=$(docker logs remotely-test 2>&1 | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Container log::$LOGS"
            docker inspect remotely-test --format '{{.State.Status}} exit={{.State.ExitCode}}' || true
            exit 1
          fi
          grep -q "Remotely" /tmp/index.html || { echo "::error title=Smoke test::Página inicial inesperada"; exit 1; }
          docker exec remotely-test curl -fs http://localhost:5000/api/healthcheck \
            || { echo "::error title=Smoke test::/api/healthcheck falhou"; exit 1; }
          for path in /Account/Login /downloads /css/modern.css; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000$path")
            echo "$path -> $c"
            [ "$c" = "200" ] || { echo "::error title=Smoke test::$path retornou $c"; exit 1; }
          done
          # Páginas protegidas devem redirecionar para o login quando anônimo.
          for path in / /server-config /manage-organization /Viewer /swagger/index.html; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000$path")
            echo "$path -> $c"
            [ "$c" = "302" ] || { echo "::error title=Smoke test::$path deveria exigir login (retornou $c)"; exit 1; }
          done
          hdr=$(curl -sI http://localhost:5000/ | tr -d '\r')
          echo "$hdr" | grep -qi '^x-content-type-options: nosniff' || { echo "::error title=Smoke test::Cabeçalhos de segurança ausentes"; exit 1; }
          for f in Remotely-Win-x64.zip Remotely-Linux.zip Win-x64/Remotely_Desktop.exe AgentVersion.txt; do
            docker exec remotely-test test -f "/app/wwwroot/Content/$f" \
              || { echo "::error title=Smoke test::Arquivo dos agents ausente na imagem: $f"; exit 1; }
          done
          c=$(curl -s -o /dev/null -w '%{http_code}' -I http://localhost:5000/Content/Remotely-Win-x64.zip)
          [ "$c" = "200" ] || { echo "::error title=Smoke test::Download do agent Windows retornou $c"; exit 1; }
          # Cadastro do primeiro usuário (vira admin do servidor) e login via cookie:
          # exercita Identity + EF Core no .NET 10 de ponta a ponta.
          curl -s -c jar -b jar http://localhost:5000/Account/Register -o reg.html
          TOKEN=$(python3 -c "import re,sys;h=open('reg.html').read();m=re.search(r'<input[^>]*name=\"__RequestVerificationToken\"[^>]*>',h);print(re.search(r'value=\"([^\"]+)\"',m.group(0)).group(1) if m else '')")
          [ -n "$TOKEN" ] || { echo "::error title=Smoke test::Token antiforgery não encontrado no cadastro"; exit 1; }
          c=$(curl -s -c jar -b jar -o reg_post.html -w '%{http_code}' -X POST http://localhost:5000/Account/Register \
            --data-urlencode "_handler=register" \
            --data-urlencode "__RequestVerificationToken=$TOKEN" \
            --data-urlencode "Input.Email=admin@teste.local" \
            --data-urlencode "Input.Password=Teste@12345" \
            --data-urlencode "Input.ConfirmPassword=Teste@12345")
          echo "register -> $c"
          if [ "$c" != "302" ]; then
            MSG=$(python3 -c "import re,html;t=open('reg_post.html').read();t=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>','',t);t=html.unescape(re.sub(r'<[^>]+>',' ',t));print(' '.join(t.split())[:1500])")
            echo "::error title=Smoke test::Cadastro retornou $c. Página: $MSG"
            LOGS=$(docker logs remotely-test 2>&1 | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Container log::$LOGS"
            exit 1
          fi
          home=$(curl -s -b jar http://localhost:5000/)
          echo "$home" | grep -q "Dispositivos" || { echo "::error title=Smoke test::Página inicial logada não exibiu os dispositivos"; exit 1; }
          c=$(curl -s -b jar -o /dev/null -w '%{http_code}' http://localhost:5000/server-config)
          [ "$c" = "200" ] || { echo "::error title=Smoke test::Admin não acessou /server-config ($c)"; exit 1; }
          # Conexão em tempo real do Blazor (sem ela nenhum botão do painel funciona).
          c=$(curl -s -b jar -o negotiate.json -w '%{http_code}' -X POST "http://localhost:5000/_blazor/negotiate?negotiateVersion=1")
          if [ "$c" != "200" ] || ! grep -q '"WebSockets"' negotiate.json; then
            echo "::error title=Smoke test::/_blazor/negotiate retornou $c"; head -c 500 negotiate.json; exit 1
          fi
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/_framework/blazor.web.js)
          [ "$c" = "200" ] || { echo "::error title=Smoke test::blazor.web.js retornou $c"; exit 1; }
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/swagger/v1/swagger.json)
          [ "$c" = "401" ] || { echo "::error title=Smoke test::swagger.json deveria exigir login (retornou $c)"; exit 1; }
          c=$(curl -s -b jar -o swagger.json -w '%{http_code}' http://localhost:5000/swagger/v1/swagger.json)
          if [ "$c" != "200" ] || ! grep -q '/api/Devices' swagger.json; then
            echo "::error title=Smoke test::Swagger não gerou a documentação da API ($c)"
            head -c 1500 swagger.json; exit 1
          fi
          c=$(curl -s -b jar -o /dev/null -w '%{http_code}' http://localhost:5000/swagger/index.html)
          [ "$c" = "200" ] || { echo "::error title=Smoke test::/swagger/index.html retornou $c"; exit 1; }
          echo "::notice title=Smoke test::OK - imagem iniciou, migrou o banco, cadastro/login funcionaram, Swagger e páginas responderam"

      - name: Login no GHCR
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no Docker Hub
        if: needs.version.outputs.publish == 'true' && env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Tags da imagem
        if: needs.version.outputs.publish == 'true'
        id: tags
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          MINOR="${V%.*}"
          TAGS="${GHCR_IMAGE}:${V},${GHCR_IMAGE}:${MINOR},${GHCR_IMAGE}:latest"
          if [ -n "$DH_USER" ]; then
            TAGS="${TAGS},${DOCKERHUB_IMAGE}:${V},${DOCKERHUB_IMAGE}:${MINOR},${DOCKERHUB_IMAGE}:latest"
          else
            echo "::warning title=Docker Hub::Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN não configurados; imagem publicada só no GHCR."
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Publicar imagem
        if: needs.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha

      - name: Resumo
        if: needs.version.outputs.publish == 'true'
        run: echo "::notice title=Imagem publicada::${{ steps.tags.outputs.tags }}"

  server-package:
    needs: [ version, create-release, agents ]
    if: ${{ !failure() && !cancelled() && needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar servidor (Linux x64, usa o runtime instalado)
        run: |
          dotnet publish Server/Server.csproj -c Release -o publish \
            -r linux-x64 --self-contained false \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:TypeScriptCompileBlocked=true \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:InformationalVersion=${{ needs.version.outputs.version }}
          # Os agents vão no pacote separado.
          find publish/wwwroot/Content -type f ! -name 'Install-*' -delete
          find publish/wwwroot/Content -mindepth 1 -type d -empty -delete

      - name: Agents compilados neste build
        uses: actions/download-artifact@v4
        with:
          name: agents-content
          path: agents-content

      - name: Empacotar
        run: |
          (cd publish && zip -qr ../Remotely_Server_Linux-x64.zip .)
          (cd agents-content && zip -qr -0 ../Remotely_Agents.zip .)
          sha256sum Remotely_Server_Linux-x64.zip > Remotely_Server_Linux-x64.zip.sha256
          sha256sum Remotely_Agents.zip > Remotely_Agents.zip.sha256
          ls -lh *.zip
          echo "::notice title=Pacotes::Servidor $(du -h Remotely_Server_Linux-x64.zip | cut -f1), agents $(du -h Remotely_Agents.zip | cut -f1)"

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            Remotely_Server_Linux-x64.zip Remotely_Server_Linux-x64.zip.sha256 \
            Remotely_Agents.zip Remotely_Agents.zip.sha256 \
            --clobber --repo "${{ github.repository }}"
