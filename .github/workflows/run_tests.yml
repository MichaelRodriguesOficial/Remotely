name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:

    strategy:
      matrix:
        configuration: [Release]

    # Desktop.Win targets Windows, so the full solution must build on Windows.
    runs-on: windows-latest

    env:
      Configuration: ${{ matrix.configuration }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      id: restore
      run: dotnet restore

    - name: Build
      id: build
      shell: pwsh
      run: |
        dotnet build --no-restore -c $env:Configuration 2>&1 | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) {
          # Surface compiler errors as annotations so they're visible on the PR.
          Select-String -Path build.log -Pattern ": error " |
            Select-Object -ExpandProperty Line -Unique -First 50 |
            ForEach-Object { Write-Output "::error title=Build::$_" }
          exit 1
        }

    - name: Execute unit tests
      id: test
      shell: pwsh
      run: |
        dotnet test --no-build -c $env:Configuration --verbosity normal 2>&1 | Tee-Object -FilePath test.log
        if ($LASTEXITCODE -ne 0) {
          # Surface failing tests as annotations so they're visible on the PR.
          Select-String -Path test.log -Pattern "^\s*Failed |Error Message:|^\s+at |error " -Context 0,2 |
            Select-Object -First 40 |
            ForEach-Object { Write-Output "::error title=Tests::$($_.Line.Trim()) $($_.Context.PostContext -join ' ')" }
          exit 1
        }

    - name: List vulnerable packages
      id: vulnerable
      # Informational: reported as warnings on the PR, doesn't fail the build.
      continue-on-error: true
      shell: pwsh
      run: |
        dotnet list Remotely.sln package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath vulnerable.log
        $vulnerable = Select-String -Path vulnerable.log -Pattern "has the following vulnerable packages" -Quiet
        if ($vulnerable) {
          $project = ""
          foreach ($line in Get-Content vulnerable.log) {
            if ($line -match "Project .(.+). has the following vulnerable packages") { $project = $Matches[1] }
            elseif ($line -match "^\s+>") { Write-Output "::warning title=Vulnerable package ($project)::$($line.Trim())" }
          }
        }

    - name: Summary
      if: always()
      shell: pwsh
      run: |
        Write-Output "::notice title=Steps::restore=${{ steps.restore.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }} vulnerable=${{ steps.vulnerable.outcome }}"
