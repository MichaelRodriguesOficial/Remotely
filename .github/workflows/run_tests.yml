name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:

    strategy:
      matrix:
        configuration: [Release]

    # Desktop.Win targets Windows, so the full solution must build on Windows.
    runs-on: windows-latest

    env:
      Configuration: ${{ matrix.configuration }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c ${{ env.Configuration }}

    - name: Execute unit tests
      run: dotnet test --no-build -c ${{ env.Configuration }} --verbosity normal

    - name: List vulnerable packages
      run: dotnet list package --vulnerable --include-transitive
